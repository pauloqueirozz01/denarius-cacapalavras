name: denarius-finance-game

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-denarius}
      MYSQL_USER: ${DB_USERNAME:-denarius}
      MYSQL_PASSWORD: ${DB_PASSWORD:-denarius}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - denarius-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"

volumes:
  denarius-mysql:
